<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Market — Покупка игровых ресурсов</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }
        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }
        .market-container {
            width: 100%;
            max-width: 600px;
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .product-card {
            background: #222227;
            border-left: 4px solid #00ff66;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h3 {
            margin: 0 0 5px 0;
            color: #fff;
        }
        .product-info p {
            margin: 0;
            color: #888;
            font-size: 0.9em;
        }
        .price {
            color: #00ff66;
            font-weight: bold;
            font-size: 1.2em;
        }
        .btn-buy {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy:hover {
            background-color: #00cc52;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>GAME MARKET</h1>
        <div class="subtitle">Покупка нужных игровых ресурсов</div>
    </header>

    <div class="market-container">
        <!-- Товар 1 -->
        <div class="product-card">
            <div class="product-info">
                <h3>Игровая валюта (Робуксы)</h3>
                <p>Пакет: 1000 R$ (Быстрая доставка)</p>
            </div>
            <div>
                <div class="price">799 ₽</div>
                <button class="btn-buy" onclick="alert('Кнопка работает! Скоро здесь будет покупка.')">Купить</button>
            </div>
        </div>

        <!-- Товар 2 -->
        <div class="product-card">
            <div class="product-info">
                <h3>Премиум Скрипт (Гонки)</h3>
                <p>Готовая система автодрома для Roblox Studio</p>
            </div>
            <div>
                <div class="price">350 ₽</div>
                <button class="btn-buy" onclick="alert('Кнопка работает! Скоро здесь будет покупка.')">Купить</button>
            </div>
        </div>

        <!-- Товар 3 -->
        <div class="product-card">
            <div class="product-info">
                <h3>Разработка Магазина под ключ</h3>
                <p>Создание кастомного внутриигрового магазина</p>
            </div>
            <div>
                <div class="price">1500 ₽</div>
                <button class="btn-buy" onclick="alert('Кнопка работает! Скоро здесь будет покупка.')">Купить</button>
            </div>
        </div>
    </div>

</body>
</html>
