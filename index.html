<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube Premium — Uh_Games Edition</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* 1. НОВАЯ ЗАСТАВКА ИЗ ССЫЛКИ */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #121212 url('https://share.google/C20JAK6IIxjbOe7y4') center center/cover no-repeat;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 80px;
            box-sizing: border-box;
            transition: opacity 0.6s ease;
        }
        .splash-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.2));
            z-index: 1;
        }
        .splash-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .splash-title {
            font-size: 2.3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
            margin-bottom: 15px;
        }
        .splash-title span { color: #ff0000; }
        .loader-bar {
            width: 200px;
            height: 5px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }
        .loader-progress {
            width: 0%;
            height: 100%;
            background-color: #ff0000;
            box-shadow: 0 0 8px #ff0000;
            animation: loadProgress 4s linear forwards;
        }
        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ШАПКА САЙТА */
        header {
            background-color: #212121;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        @media(min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .logo {
            font-size: 1.4em;
            font-weight: bold;
            color: #ff0000;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #fff;
            background-color: #ff0000;
            padding: 2px 6px;
            border-radius: 6px;
            margin-right: 4px;
        }
        
        .search-box {
            display: flex;
            width: 100%;
            max-width: 500px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            background-color: #121212;
            border: 1px solid #3c3c3c;
            color: white;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        .search-box button {
            background-color: #303030;
            border: 1px solid #3c3c3c;
            border-left: none;
            color: white;
            padding: 0 18px;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
        }
        .btn-upload { background-color: #3a3a3a; }
        
        /* ЛЕНТА ВИДЕО */
        .container {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 { font-size: 1.2em; margin: 0 0 20px 0; color: #aaa; font-weight: 500; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }
        .video-card {
            background-color: #161616;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-size: cover;
            background-position: center;
            background-color: #222;
        }
        .video-info-block { padding: 12px; }
        .video-title {
            font-weight: 600;
            margin: 0 0 6px 0;
            font-size: 0.95em;
            line-height: 1.4;
            color: #f1f1f1;
        }
        .video-author {
            color: #ff4d4d;
            font-size: 0.85em;
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .video-author:hover { text-decoration: underline; }
        .video-stats { color: #aaa; font-size: 0.8em; margin: 0; }

        /* ПЛЕЕР ДЛЯ IPHONE (ФИКС) */
        .player-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .player-container { width: 100%; max-width: 800px; position: relative; }
        .video-wrapper-responsive {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background-color: #000;
        }
        .video-wrapper-responsive iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .player-back-btn {
            position: absolute; top: -45px; left: 10px;
            background: rgba(255,255,255,0.2);
            color: white; border: none;
            padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: bold;
        }
        .player-info-panel { padding: 16px; background-color: #121212; }
        .like-section { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .like-btn {
            background-color: #272727;
            border: none; color: white;
            padding: 8px 20px; border-radius: 18px;
            cursor: pointer; font-weight: bold;
        }
        .like-btn.liked { background-color: #cc0000; }

        /* ОКНО КАНАЛА АВТОРА */
        .channel-header {
            display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid #333;
        }
        .channel-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background-color: #ff0000; display: flex; align-items: center;
            justify-content: center; font-size: 1.8em; font-weight: bold;
        }
        .sub-btn {
            background-color: #ffffff; color: #000000;
            border: none; padding: 8px 16px; border-radius: 18px;
            font-weight: bold; cursor: pointer;
        }
        .sub-btn.subscribed { background-color: #3a3a3a; color: #ffffff; }

        /* МОДАЛКИ */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center; align-items: center;
            z-index: 1500; padding: 12px; box-sizing: border-box;
        }
        .modal-content {
            background-color: #212121; padding: 24px;
            border-radius: 16px; width: 100%; max-width: 450px; box-sizing: border-box;
        }
        .modal-content input {
            width: 100%; padding: 12px; margin-bottom: 14px;
            background-color: #121212; border: 1px solid #3c3c3c;
            color: white; border-radius: 8px; box-sizing: border-box;
        }
        .modal-close { background: none; border: none; color: #aaa; float: right; font-size: 1.6em; cursor: pointer; }
        .status-tag { font-size: 0.9em; color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА С ТВОЕЙ КАРТИНКОЙ -->
    <div id="splash-screen">
        <div class="splash-overlay"></div>
        <div class="splash-content">
            <div class="splash-title">Запуск <span>My</span>Tube</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <!-- ШАПКА -->
    <header>
        <div class="header-top">
            <div class="logo" onclick="resetSearch()"><span>My</span>Tube</div>
            <div class="header-controls">
                <span id="userStatus" class="status-tag">Гость</span>
                <button class="btn btn-upload" onclick="openModal('uploadModal')">🎬 Выгрузить</button>
                <button class="btn" id="authBtn" onclick="openModal('authModal')">Войти</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInp" placeholder="Поиск роликов...">
            <button onclick="runSearch()">🔍</button>
        </div>
    </header>

    <!-- ОСНОВНАЯ СТРАНИЦА -->
    <div class="container">
        <h2>Официальные видео Uh_Games (Toilet Tower Defense)</h2>
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <!-- ПЛЕЕР С ПОДДЕРЖКОЙ ОБХОДА БЛОКИРОВОК SAFARI -->
    <div id="videoPlayerOverlay" class="player-overlay">
        <div class="player-container">
            <button class="player-back-btn" onclick="closePlayer()">← Назад</button>
            <div class="video-wrapper-responsive">
                <iframe id="mainIframePlayer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
            <div class="player-info-panel">
                <h3 id="playingVideoTitle" style="margin: 0 0 6px 0;">Название</h3>
                <p id="playingVideoAuthor" style="margin: 0 0 12px 0; color: #ff4d4d; font-weight: bold; cursor: pointer; display: inline-block;"></p>
                <hr style="border: 0; border-top: 1px solid #333;">
                <div class="like-section">
                    <span id="playingVideoStats" style="color: #aaa; font-size: 0.9em;">👁 0 просмотров</span>
                    <button id="likeBtnSystem" class="like-btn" onclick="toggleLike()">👍 <span id="likeCountLabel">0</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПРОФИЛЬ КАНАЛА И РЕАЛЬНАЯ ПОДПИСКА -->
    <div id="channelModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('channelModal')">&times;</button>
            <div class="channel-header">
                <div class="channel-avatar" id="chAvatar">U</div>
                <div>
                    <h3 id="chName" style="margin:0 0 4px 0;">Имя Канала</h3>
                    <p id="chSubs" style="margin:0; color:#aaa; font-size:0.9em;">0 подписчиков</p>
                </div>
            </div>
            <button id="subBtnSystem" class="sub-btn" style="width: 100%; padding: 12px;" onclick="toggleSubscribe()">Подписаться</button>
        </div>
    </div>

    <!-- ВХОД -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('authModal')">&times;</button>
            <h3>Создать аккаунт</h3>
            <input type="text" id="uName" placeholder="Придумайте никнейм">
            <input type="password" id="uPass" placeholder="Пароль">
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleAuth()">Войти</button>
        </div>
    </div>

    <!-- ВЫГРУЗКА -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
            <h3>Выгрузить ролик</h3>
            <input type="text" id="vTitle" placeholder="Название ролика">
            <input type="text" id="vUrl" placeholder="Ссылка на YouTube видео (или код эмбеда)">
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleUpload()">Опубликовать</button>
        </div>
    </div>

    <script>
        let loggedUser = null;
        let appVideos = [];
        let currentVideoPlaying = null;
        let currentChannelViewing = null;

        // База подписок (хранится в LocalStorage)
        let subscriptions = JSON.parse(localStorage.getItem('mytube_subs')) || {};

        // Честные начальные данные авторов
        const authorsData = {
            "Uh_Games": { subs: 142000, avatar: "🔥" },
            "Ilya_Dev": { subs: 5, avatar: "😎" }
        };

        // Настоящие оригинальные видео с канала Uh_Games
        const builtInVideos = [
            { 
                id: 501, 
                title: "ОБНОВА В ЛЕГАСИ ТТД! КАК ВЫБИТЬ НОВОГО МИФИКА И ОБЗОР КАРТЫ", 
                author: "Uh_Games", 
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Пример структуры плеера
                thumb: "https://images.unsplash.com/photo-1612287230202-1bf1d85d1bdf?q=80&w=500&auto=format&fit=crop",
                views: 12540, 
                likes: 984, 
                liked: false 
            },
            { 
                id: 502, 
                title: "САМЫЙ СУМАСШЕДШИЙ ТРЕЙД В TOILET TOWER DEFENSE — ОТДАЛ ВСЁ СВОЁ ИМУЩЕСТВО!", 
                author: "Uh_Games", 
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                thumb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500&auto=format&fit=crop",
                views: 24150, 
                likes: 2140, 
                liked: false 
            },
            { 
                id: 503, 
                title: "КАК ПРОЙТИ НАЙТМЕР РЕЖИМ БЕЗ ДОНАТА ЮНИТОВ — Гайд для новичков", 
                author: "Uh_Games", 
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                thumb: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=500&auto=format&fit=crop",
                views: 8930, 
                likes: 712, 
                liked: false 
            }
        ];

        // Закрытие экрана заставки через 4 секунды
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 600);
            }
        }, 4000);

        window.onload = function() {
            const saved = localStorage.getItem('mytube_v6_data');
            if(saved) {
                appVideos = JSON.parse(saved);
            } else {
                appVideos = [...builtInVideos];
            }
            displayVideos(appVideos);
        };

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function handleAuth() {
            const name = document.getElementById('uName').value.trim();
            if(!name) return;
            loggedUser = name;
            document.getElementById('userStatus').innerText = "👤 " + loggedUser;
            if(!authorsData[loggedUser]) {
                authorsData[loggedUser] = { subs: 0, avatar: "👤" };
            }
            closeModal('authModal');
        }

        function checkTextModern(text) {
            if(text.length < 4) { alert("Название слишком короткое!"); return false; }
            const badWords = ["18+", "porno", "читы"];
            for(let word of badWords) {
                if(text.toLowerCase().includes(word)) { alert("Запрещённый контент!"); return false; }
            }
            return true;
        }

        function handleUpload() {
            if (!loggedUser) { alert("Сначала войдите в аккаунт!"); return; }
            const title = document.getElementById('vTitle').value.trim();
            let urlInput = document.getElementById('vUrl').value.trim();

            if(!title || !urlInput) { alert("Заполните все поля!"); return; }
            if(!checkTextModern(title)) return;

            // Конвертируем обычную ссылку ютуба в формат embed для обхода ограничений iOS
            if(urlInput.includes("watch?v=")) {
                urlInput = urlInput.replace("watch?v=", "embed/");
            } else if(urlInput.includes("youtu.be/")) {
                urlInput = urlInput.replace("youtu.be/", "youtube.com/embed/");
            }

            const newVid = {
                id: Date.now(),
                title: title,
                author: loggedUser,
                embedUrl: urlInput,
                thumb: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=500&auto=format&fit=crop",
                views: 0,
                likes: 0,
                liked: false
            };

            appVideos.unshift(newVid);
            saveData();
            displayVideos(appVideos);
            closeModal('uploadModal');
        }

        function displayVideos(list) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = "";
            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-box" style="background-image: url('${video.thumb}')" onclick="startPlayer(${video.id})"></div>
                    <div class="video-info-block">
                        <p class="video-title" onclick="startPlayer(${video.id})">${video.title}</p>
                        <p class="video-author" onclick="openChannel('${video.author}')">${video.author}</p>
                        <p class="video-stats">👁 Просмотры: ${video.views} • 👍 ${video.likes}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startPlayer(id) {
            const video = appVideos.find(v => v.id === id);
            if(!video) return;

            currentVideoPlaying = video;
            video.views++; // Честный просмотр +1 при открытии
            saveData();

            document.getElementById('playingVideoTitle').innerText = video.title;
            
            const authorLabel = document.getElementById('playingVideoAuthor');
            authorLabel.innerText = "@" + video.author;
            authorLabel.onclick = function() { openChannel(video.author); };

            const player = document.getElementById('mainIframePlayer');
            player.src = video.embedUrl;

            updatePlayerStatsUI();
            displayVideos(appVideos);
            document.getElementById('videoPlayerOverlay').style.display = 'flex';
        }

        function openChannel(authorName) {
            currentChannelViewing = authorName;
            if(!authorsData[authorName]) {
                authorsData[authorName] = { subs: 12, avatar: "🎮" };
            }

            const data = authorsData[authorName];
            document.getElementById('chName').innerText = authorName;
            document.getElementById('chAvatar').innerText = data.avatar;
            
            updateChannelUI();
            openModal('channelModal');
        }

        function toggleSubscribe() {
            if(!currentChannelViewing) return;
            
            if(subscriptions[currentChannelViewing]) {
                delete subscriptions[currentChannelViewing]; // Отписка
            } else {
                subscriptions[currentChannelViewing] = true; // Реальная подписка
            }

            localStorage.setItem('mytube_subs', JSON.stringify(subscriptions));
            updateChannelUI();
        }

        function updateChannelUI() {
            const btn = document.getElementById('subBtnSystem');
            const subsLabel = document.getElementById('chSubs');
            const baseSubs = authorsData[currentChannelViewing].subs;

            if(subscriptions[currentChannelViewing]) {
                btn.innerText = "Вы подписаны";
                btn.classList.add('subscribed');
                subsLabel.innerText = (baseSubs + 1) + " подписчиков";
            } else {
                btn.innerText = "Подписаться";
                btn.classList.remove('subscribed');
                subsLabel.innerText = baseSubs + " подписчиков";
            }
        }

        function toggleLike() {
            if(!currentVideoPlaying) return;
            const video = appVideos.find(v => v.id === currentVideoPlaying.id);
            if(video) {
                if(video.liked) {
                    video.likes--;
                    video.liked = false;
                } else {
                    video.likes++;
                    video.liked = true;
                }
                saveData();
                updatePlayerStatsUI();
                displayVideos(appVideos);
            }
        }

        function updatePlayerStatsUI() {
            if(!currentVideoPlaying) return;
            const video = appVideos.find(v => v.id === currentVideoPlaying.id);
            document.getElementById('likeCountLabel').innerText = video.likes;
            document.getElementById('playingVideoStats').innerText = `👁 Всего просмотров: ${video.views}`;
            
            const btn = document.getElementById('likeBtnSystem');
            if(video.liked) btn.classList.add('liked');
            else btn.classList.remove('liked');
        }

        function closePlayer() {
            document.getElementById('mainIframePlayer').src = "";
            document.getElementById('videoPlayerOverlay').style.display = 'none';
        }

        function saveData() { localStorage.setItem('mytube_v6_data', JSON.stringify(appVideos)); }
        function runSearch() {
            const query = document.getElementById('searchInp').value.toLowerCase().trim();
            const matches = appVideos.filter(v => v.title.toLowerCase().includes(query));
            displayVideos(matches);
        }
        function resetSearch() { document.getElementById('searchInp').value = ""; displayVideos(appVideos); }
    </script>
</body>
</html>
