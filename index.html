<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube — Настоящий Видеохостинг</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        /* ШАПКА */
        header {
            background-color: #212121;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.4em;
            font-weight: bold;
            color: #ff0000;
            cursor: pointer;
        }
        .logo span {
            color: #fff;
            background-color: #ff0000;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 2px;
        }
        .search-box {
            width: 40%;
            display: flex;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background-color: #121212;
            border: 1px solid #303030;
            color: white;
            border-radius: 2px 0 0 2px;
        }
        .search-box button {
            background-color: #303030;
            border: none;
            color: white;
            padding: 0 15px;
            cursor: pointer;
        }
        .header-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background-color: #990000; }
        .btn-upload { background-color: #3a3a3a; }
        .btn-upload:hover { background-color: #505050; }

        /* КОНТЕНТ */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background-color: #171717;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #252525;
            cursor: pointer;
            transition: 0.2s;
        }
        .video-card:hover { transform: scale(1.03); }
        .thumbnail {
            width: 100%;
            height: 160px;
            background: linear-gradient(45deg, #333, #111);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
        }
        .video-info { padding: 12px; }
        .video-title { font-weight: bold; margin: 0 0 6px 0; font-size: 0.95em; }
        .video-author { color: #aaa; font-size: 0.85em; }
        
        /* МОДАЛЬНЫЕ ОКНА */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #212121;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #383838;
            box-sizing: border-box;
        }
        .modal-content h3 { margin-top: 0; color: #ff0000; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #121212;
            border: 1px solid #303030;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .close-btn {
            background: none; border: none; color: #aaa;
            float: right; font-size: 1.8em; cursor: pointer; margin-top: -10px;
        }
        .user-status { font-size: 0.9em; color: #00ff66; }

        /* СТИЛЬ ДЛЯ НАСТОЯЩЕГО ПЛЕЕРА */
        video {
            width: 100%;
            max-height: 350px;
            border-radius: 6px;
            background-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showAllVideos()"><span>My</span>Tube</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск видео...">
            <button onclick="searchVideos()">🔍</button>
        </div>
        <div class="header-buttons">
            <span id="usernameDisplay" class="user-status">Гость</span>
            <button class="btn btn-upload" onclick="openModal('uploadModal')">🎬 Выгрузить видео</button>
            <button class="btn" id="authBtn" onclick="openModal('authModal')">Войти</button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">Рекомендации</h2>
        <div class="video-grid" id="videoGrid">
            </div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h3 id="playerTitle" style="color: #fff; margin-bottom: 15px;">Просмотр</h3>
            <div id="videoWrapper">
                </div>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
            <h3>Вход / Регистрация</h3>
            <input type="text" id="regUsername" placeholder="Придумайте никнейм">
            <input type="password" id="regPassword" placeholder="Придумайте пароль">
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="registerOrLogin()">Войти</button>
        </div>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('uploadModal')">&times;</button>
            <h3>Выгрузить из галереи</h3>
            <input type="text" id="videoTitle" placeholder="Название видеоролика">
            <textarea id="videoDesc" placeholder="Описание ролика" rows="2"></textarea>
            
            <label style="display:block; margin: 10px 0 5px 0; color: #aaa; font-size: 0.9em;">Выбрать файл видео:</label>
            <input type="file" id="videoFileInput" accept="video/*" style="background: none; border: none; padding: 0;">
            
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="uploadVideo()">Опубликовать ролик</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        
        // Стартовые ролики-заглушки (пока ты не загрузил свои файлы из галереи)
        let dbVideos = [
            { id: 1, title: "Добро пожаловать в MyTube! Создай аккаунт и загрузи видео из галереи.", author: "Админ", fileData: "placeholder" },
        ];

        window.onload = function() {
            renderVideos(dbVideos);
        };

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Вход
        function registerOrLogin() {
            const user = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            if (!user || !pass) { alert("Введите данные!"); return; }
            currentUser = user;
            document.getElementById('usernameDisplay').innerText = "👤 " + currentUser;
            document.getElementById('authBtn').innerText = "Выйти";
            document.getElementById('authBtn').onclick = logout;
            closeModal('authModal');
        }

        function logout() {
            currentUser = null;
            document.getElementById('usernameDisplay').innerText = "Гость";
            document.getElementById('authBtn').innerText = "Войти";
            document.getElementById('authBtn').onclick = function() { openModal('authModal'); };
        }

        // ИИ-Фильтр
        function runAIModeration(title, desc) {
            const text = (title + " " + desc).toLowerCase();
            const badWords = ["18+", "секс", "sex", "порно", "пошлое", "слив"];
            for (let word of badWords) {
                if (text.includes(word)) return false;
            }
            return true;
        }

        // ВЫГРУЗКА ИЗ ГАЛЕРЕИ
        function uploadVideo() {
            if (!currentUser) { alert("Сначала войдите в аккаунт!"); return; }
            
            const title = document.getElementById('videoTitle').value.trim();
            const desc = document.getElementById('videoDesc').value.trim();
            const fileInput = document.getElementById('videoFileInput');

            if (!title) { alert("Укажите название ролику!"); return; }
            if (fileInput.files.length === 0) { alert("Выберите видеофайл из галереи!"); return; }

            // Проверка модерации
            if (!runAIModeration(title, desc)) {
                alert("ИИ Модерация: Видео заблокировано за недопустимый контент!");
                return;
            }

            const file = fileInput.files[0];
            // Создаем временную ссылку на файл из памяти телефона
            const videoObjectURL = URL.createObjectURL(file);

            const newVideo = {
                id: Date.now(),
                title: title,
                author: currentUser,
                fileData: videoObjectURL // Сохраняем ссылку на плеер
            };

            dbVideos.unshift(newVideo);
            renderVideos(dbVideos);
            closeModal('uploadModal');

            // Очистка формы
            document.getElementById('videoTitle').value = "";
            document.getElementById('videoDesc').value = "";
            fileInput.value = "";

            alert("Видео успешно загружено и доступно для просмотра!");
        }

        // ВЫВОД КАРТОЧЕК НА ЭКРАН
        function renderVideos(list) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";

            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = function() { openPlayer(video); };
                card.innerHTML = `
                    <div class="thumbnail">🎬</div>
                    <div class="video-info">
                        <p class="video-title">${video.title}</p>
                        <p class="video-author">${video.author}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // НАСТОЯЩИЙ ПЛЕЕР
        function openPlayer(video) {
            if (video.fileData === "placeholder") {
                alert("Это приветственное видео! Чтобы протестировать плеер, войдите в аккаунт и загрузите любой ролик из галереи.");
                return;
            }
            
            document.getElementById('playerTitle').innerText = video.title;
            const wrapper = document.getElementById('videoWrapper');
            
            // Встраиваем настоящий HTML5 плеер
            wrapper.innerHTML = `
                <video src="${video.fileData}" controls autoplay></video>
            `;
            
            openModal('playerModal');
        }

        function closePlayer() {
            const wrapper = document.getElementById('videoWrapper');
            wrapper.innerHTML = ""; // Полностью уничтожаем плеер, чтобы звук выключился
            closeModal('playerModal');
        }

        // ПОИСК
        function searchVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = dbVideos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
        }

        function showAllVideos() {
            document.getElementById('searchInput').value = "";
            renderVideos(dbVideos);
        }
    </script>
</body>
</html>
