<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube — Проект Закрыт</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #444;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .logo span {
            background-color: #222;
            color: #444;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-tag {
            font-size: 3.5em;
            font-weight: 900;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 51, 51, 0.5);
            margin: 0 0 15px 0;
            animation: pulse 2s infinite ease-in-out;
        }

        .description {
            font-size: 1.1em;
            color: #888;
            max-width: 450px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 400;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 35px rgba(255, 51, 51, 0.8); }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"><span>My</span>Tube Archive</div>
        <h1 class="status-tag">Проект Закрыт</h1>
        <p class="description">
            Разработка и поддержка платформы официально прекращены. Сайт отправлен в архив истории. Спасибо всем, кто следил за обновлениями и тестировал систему!
        </p>
    </div>

</body>
</html>
