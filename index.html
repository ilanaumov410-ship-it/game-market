<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSound | Твоя музыка</title>
    <style>
        :root {
            --bg-main: #111111;
            --bg-card: #1a1a1a;
            --accent: #ff5500; /* Тот самый оранжевый цвет SoundCloud */
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding-bottom: 100px; /* Место для нижнего плеера */
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* СЕТКА ТРЕКОВ */
        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .track-card {
            background-color: var(--bg-card);
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            position: relative;
        }

        .track-card:hover {
            background-color: #222;
            transform: translateY(-3px);
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1;
            background-color: #333;
            border-radius: 4px;
            margin-bottom: 12px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-card .play-btn-overlay {
            width: 50px;
            height: 50px;
            background-color: var(--accent);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .track-card:hover .play-btn-overlay {
            display: flex;
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* НИЖНИЙ СТРИМИНГ-ПЛЕЕР */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e1e1e;
            border-top: 1px solid #282828;
            padding: 15px 30px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            align-items: center;
            width: 30%;
        }

        .player-cover {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 4px;
            margin-right: 15px;
            background-size: cover;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .control-btns {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            align-items: center;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-play {
            width: 40px;
            height: 40px;
            background-color: white;
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .timeline-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: #444;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-current {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            border-radius: 2px;
        }

        .volume-container {
            width: 20%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>CLOUDSOUND</h1>
    </header>

    <div class="container">
        <h2>Недавние релизы</h2>
        <div class="track-grid" id="catalog">
            <!-- Сюда JS добавит треки -->
        </div>
    </div>

    <!-- ФИКСИРОВАННЫЙ ПЛЕЕР -->
    <div class="player-bar">
        <div class="player-info">
            <div class="player-cover" id="pCover"></div>
            <div>
                <p class="track-title" id="pTitle">Выберите трек</p>
                <p class="track-author" id="pAuthor">-</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button class="btn">⏮</button>
                <button class="btn btn-play" id="mainPlayBtn" onclick="togglePlay()">▶</button>
                <button class="btn">⏭</button>
            </div>
            <div class="timeline-container">
                <span id="timeCurrent">0:00</span>
                <div class="progress-bar" id="progressLine" onclick="seek(event)">
                    <div class="progress-current" id="progressVal"></div>
                </div>
                <span id="timeTotal">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume()">
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ ТРЕКОВ (Сюда вставляются прямые ссылки на mp3 файлы и картинки)
        const tracks = [
            { 
                id: 1, 
                title: "Cyberpunk Drive", 
                author: "Neon Synth", 
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=300", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
            },
            { 
                id: 2, 
                title: "Summer Chills", 
                author: "Lofi Beats", 
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=300", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" 
            },
            { 
                id: 3, 
                title: "Dark Atmosphere", 
                author: "Ambient Project", 
                cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300", 
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" 
            }
        ];

        const audio = new Audio();
        let currentTrackId = null;

        // Генерация карточек в каталог
        const catalog = document.getElementById('catalog');
        tracks.forEach(track => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.onclick = () => playTrack(track);
            card.innerHTML = `
                <div class="cover-art" style="background-image: url('${track.cover}')">
                    <div class="play-btn-overlay">▶</div>
                </div>
                <p class="track-title">${track.title}</p>
                <p class="track-author">${track.author}</p>
            `;
            catalog.appendChild(card);
        });

        function playTrack(track) {
            if (currentTrackId === track.id) {
                togglePlay();
                return;
            }

            currentTrackId = track.id;
            audio.src = track.url;
            audio.play();

            // Обновляем плеер бар
            document.getElementById('pTitle').innerText = track.title;
            document.getElementById('pAuthor').innerText = track.author;
            document.getElementById('pCover').style.backgroundImage = `url('${track.cover}')`;
            document.getElementById('mainPlayBtn').innerText = "⏸";
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                document.getElementById('mainPlayBtn').innerText = "⏸";
            } else {
                audio.pause();
                document.getElementById('mainPlayBtn').innerText = "▶";
            }
        }

        // Логика обновления таймлайна
        audio.ontimeupdate = () => {
            const current = audio.currentTime;
            const duration = audio.duration || 0;
            
            // Процент полосы
            const pct = (current / duration) * 100;
            document.getElementById('progressVal').style.width = pct + '%';

            // Время текстом
            document.getElementById('timeCurrent').innerText = formatTime(current);
            document.getElementById('timeTotal').innerText = formatTime(duration);
        };

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function seek(event) {
            if (!audio.src) return;
            const line = document.getElementById('progressLine');
            const width = line.clientWidth;
            const clickX = event.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }

        function changeVolume() {
            audio.volume = document.getElementById('volumeSlider').value;
        }
    </script>
</body>
</html>
