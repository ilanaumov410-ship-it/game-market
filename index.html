<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube Premium — Сохранение видео и новый стиль</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        
        /* ШАПКА САЙТА */
        header {
            background-color: #212121;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        @media(min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* ЛОГОТИП С ФУРРИ НА ФОНЕ */
        .logo-wrapper {
            background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400&auto=format&fit=crop'); /* Качественный арт-фон */
            background-size: cover;
            background-position: center;
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff0000;
            cursor: pointer;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px #000000; /* Чтобы текст чётко читался на любом фоне */
        }
        .logo span {
            color: #fff;
            background-color: rgba(255, 0, 0, 0.85);
            padding: 2px 6px;
            border-radius: 6px;
            margin-right: 4px;
        }
        
        /* СТРОКА ПОИСКА */
        .search-box {
            display: flex;
            width: 100%;
            max-width: 500px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            background-color: #121212;
            border: 1px solid #3c3c3c;
            color: white;
            border-radius: 20px 0 0 20px;
            font-size: 0.95em;
            outline: none;
        }
        .search-box button {
            background-color: #303030;
            border: 1px solid #3c3c3c;
            border-left: none;
            color: white;
            padding: 0 18px;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* КНОПКИ */
        .btn {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #aa0000; }
        .btn-upload { background-color: #3a3a3a; }
        .btn-upload:hover { background-color: #4e4e4e; }
        
        /* СЕТКА ВИДЕОРОЛИКОВ */
        .container {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 { font-size: 1.3em; margin: 10px 0 20px 0; letter-spacing: -0.3px; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }
        .video-card {
            background-color: #0f0f0f;
            cursor: pointer;
        }
        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .thumbnail-box .play-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            opacity: 0.8;
        }
        .video-title {
            font-weight: 600;
            margin: 0 0 4px 0;
            font-size: 1em;
            line-height: 1.4;
            color: #f1f1f1;
        }
        .video-author { color: #aaa; font-size: 0.88em; margin: 0; }

        /* ПОЛНОЭКРАННЫЙ ПЛЕЕР */
        .player-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            max-height: 80vh;
        }
        .player-back-btn {
            position: absolute;
            top: -50px; left: 16px;
            background: rgba(255,255,255,0.2);
            color: white; border: none;
            padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-size: 1em;
        }

        /* МОДАЛЬНЫЕ ОКНА ФОРМ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1500;
            padding: 12px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #212121;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .modal-content h3 { margin: 0 0 16px 0; font-size: 1.3em; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background-color: #121212;
            border: 1px solid #3c3c3c;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .modal-close {
            background: none; border: none; color: #aaa;
            float: right; font-size: 1.6em; cursor: pointer; margin-top: -5px;
        }
        .status-tag { font-size: 0.9em; color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ШАПКА С ОБНОВЛЁННЫМ ФОНОМ ЛОГОТИПА -->
    <header>
        <div class="header-top">
            <div class="logo-wrapper">
                <div class="logo" onclick="resetSearch()"><span>My</span>Tube</div>
            </div>
            <div class="header-controls">
                <span id="userStatus" class="status-tag">Гость</span>
                <button class="btn btn-upload" onclick="openModal('uploadModal')">🎬 Выгрузить</button>
                <button class="btn" id="authBtn" onclick="openModal('authModal')">Войти</button>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInp" placeholder="Поиск роликов...">
            <button onclick="runSearch()">🔍</button>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <div class="container">
        <h2 id="feedTitle">Рекомендации</h2>
        <div class="video-grid" id="videoContainer">
            <!-- Ролики загружаются из постоянной памяти -->
        </div>
    </div>

    <!-- ПОЛНОЭКРАННЫЙ ПЛЕЕР -->
    <div id="videoPlayerOverlay" class="player-overlay">
        <div class="player-container">
            <button class="player-back-btn" onclick="closePlayer()">← Назад к списку</button>
            <video id="mainHtml5Player" controls controlsList="nodownload" playsinline></video>
            <h3 id="playingVideoTitle" style="margin: 15px 16px 0 16px; color: #fff; font-size: 1.1em;">Название видео</h3>
        </div>
    </div>

    <!-- ОКНО РЕГИСТРАЦИИ -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('authModal')">&times;</button>
            <h3>Создать аккаунт</h3>
            <input type="text" id="uName" placeholder="Придумайте никнейм">
            <input type="password" id="uPass" placeholder="Придумайте пароль">
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleAuth()">Войти в систему</button>
        </div>
    </div>

    <!-- ОКНО ВЫГРУЗКИ ИЗ ГАЛЕРЕИ -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
            <h3>Выгрузка ролика из галереи</h3>
            <input type="text" id="vTitle" placeholder="Дайте название вашему видео">
            <textarea id="vDesc" placeholder="Добавьте описание к ролику (необязательно)" rows="2"></textarea>
            
            <label style="display: block; margin-bottom: 8px; color: #ccc; font-size: 0.9em;">Выберите видеофайл с устройства:</label>
            <input type="file" id="fileSelector" accept="video/*" style="border: none; background: none; padding: 0; margin-bottom: 15px;">
            
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleUpload()">Запустить модерацию и опубликовать</button>
        </div>
    </div>

    <!-- СКРИПТ С ПАМЯТЬЮ И ЛОГИКОЙ -->
    <script>
        let loggedUser = null;
        let appVideos = [];

        // ПОДГРУЗКА ДАННЫХ ПРИ ЗАПУСКЕ САЙТА
        window.onload = function() {
            // Восстанавливаем сохранённые видео из памяти телефона
            const savedVideos = localStorage.getItem('mytube_saved_videos');
            if (savedVideos) {
                appVideos = JSON.parse(savedVideos);
            } else {
                // Стартовая заглушка, если памяти пока нет
                appVideos = [
                    { id: 1, title: "Добро пожаловать на MyTube! Создайте аккаунт и выгрузите первое видео.", author: "Модератор", videoSrc: "placeholder" }
                ];
            }
            displayVideos(appVideos);
        };

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // АВТОРИЗАЦИЯ
        function handleAuth() {
            const name = document.getElementById('uName').value.trim();
            const pass = document.getElementById('uPass').value.trim();
            if(!name || !pass) { alert("Заполните форму!"); return; }

            loggedUser = name;
            document.getElementById('userStatus').innerText = "👤 " + loggedUser;
            document.getElementById('authBtn').innerText = "Выйти";
            document.getElementById('authBtn').onclick = handleLogout;
            closeModal('authModal');
        }

        function handleLogout() {
            loggedUser = null;
            document.getElementById('userStatus').innerText = "Гость";
            document.getElementById('authBtn').innerText = "Войти";
            document.getElementById('authBtn').onclick = function() { openModal('authModal'); };
        }

        // УСИЛЕННАЯ ИИ-МОДЕРАЦИЯ
        function runAdvancedAIModeration(title, desc) {
            const fullText = (title + " " + desc).toLowerCase();
            const cleanedTitle = title.trim();

            const forbiddenWords = ["18+", "секс", "sex", "порно", "пошлое", "слив", "эротика"];
            for (let word of forbiddenWords) {
                if (fullText.includes(word)) {
                    return { ok: false, msg: "ИИ заблокировал ролик! Обнаружен запрещенный контент 18+." };
                }
            }

            let upperCount = 0;
            for(let i=0; i<cleanedTitle.length; i++) {
                if(cleanedTitle[i] === cleanedTitle[i].toUpperCase() && cleanedTitle[i] !== cleanedTitle[i].toLowerCase()) {
                    upperCount++;
                }
            }
            if(cleanedTitle.length > 4 && upperCount / cleanedTitle.length > 0.6) {
                return { ok: false, msg: "ИИ заблокировал ролик! Название не должно быть написано капсом (спам)." };
            }

            if(cleanedTitle.length < 4) {
                return { ok: false, msg: "ИИ заблокировал ролик! Название видео слишком короткое или бессмысленное." };
            }

            return { ok: true };
        }

        // ВЫГРУЗКА И НАДЁЖНОЕ СОХРАНЕНИЕ
        function handleUpload() {
            if (!loggedUser) { alert("Чтобы выгрузить видео, сначала нажмите кнопку 'Войти'!"); return; }

            const title = document.getElementById('vTitle').value.trim();
            const desc = document.getElementById('vDesc').value.trim();
            const fileSelector = document.getElementById('fileSelector');

            if (!title) { alert("Придумайте название для видеоролика!"); return; }
            if (fileSelector.files.length === 0) { alert("Выберите видеофайл из галереи вашего телефона!"); return; }

            const aiCheck = runAdvancedAIModeration(title, desc);
            if (!aiCheck.ok) { alert(aiCheck.msg); return; }

            const targetFile = fileSelector.files[0];
            
            // Читаем файл и делаем из него локальный медиа-поток
            const localVideoUrl = URL.createObjectURL(targetFile);

            const addedVideo = {
                id: Date.now(),
                title: title,
                author: loggedUser,
                videoSrc: localVideoUrl
            };

            // Если в списке висела только одна заглушка модератора — убираем её
            if (appVideos.length === 1 && appVideos[0].videoSrc === "placeholder") {
                appVideos = [];
            }

            appVideos.unshift(addedVideo);
            
            // Сохраняем обновлённый список видеороликов в локальную память телефона!
            localStorage.setItem('mytube_saved_videos', JSON.stringify(appVideos));
            
            displayVideos(appVideos);
            closeModal('uploadModal');

            document.getElementById('vTitle').value = "";
            document.getElementById('vDesc').value = "";
            fileSelector.value = "";

            alert("Видео успешно выгружено и сохранено в память устройства!");
        }

        // СБОРКА СПИСКА ВИДЕО
        function displayVideos(list) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = "";

            if(list.length === 0) {
                container.innerHTML = "<p style='color: #888; padding: 10px;'>Пока загруженных роликов нет...</p>";
                return;
            }

            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = function() { startPlayer(video); };
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <div class="play-icon">▶️</div>
                    </div>
                    <div style="padding: 4px 2px;">
                        <p class="video-title">${video.title}</p>
                        <p class="video-author">${video.author}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // РАБОТА ПЛЕЕРА
        function startPlayer(video) {
            if(video.videoSrc === "placeholder") {
                alert("Это приветственное системное сообщение. Пожалуйста, войдите в аккаунт и загрузите реальное видео из галереи!");
                return;
            }

            const overlay = document.getElementById('videoPlayerOverlay');
            const player = document.getElementById('mainHtml5Player');
            const titleLabel = document.getElementById('playingVideoTitle');

            titleLabel.innerText = video.title;
            player.src = video.videoSrc;
            
            overlay.style.display = 'flex';
            
            // Если ссылка устарела после перезахода, браузер попросит подгрузить файл заново
            player.onerror = function() {
                alert("Внимание: для безопасности телефона локальный доступ к файлу был сброшен. Пожалуйста, перезалейте этот ролик заново через кнопку 'Выгрузить', чтобы плеер его прочитал!");
                closePlayer();
            };
            
            player.play();
        }

        function closePlayer() {
            const overlay = document.getElementById('videoPlayerOverlay');
            const player = document.getElementById('mainHtml5Player');
            player.pause();
            player.src = "";
            overlay.style.display = 'none';
        }

        // ПОИСК
        function runSearch() {
            const query = document.getElementById('searchInp').value.toLowerCase().trim();
            document.getElementById('feedTitle').innerText = query ? `Результаты поиска по запросу: "${query}"` : "Рекомендации";
            
            const matches = appVideos.filter(v => v.title.toLowerCase().includes(query));
            displayVideos(matches);
        }

        function resetSearch() {
            document.getElementById('searchInp').value = "";
            document.getElementById('feedTitle').innerText = "Рекомендации";
            displayVideos(appVideos);
        }
    </script>
</body>
</html>
