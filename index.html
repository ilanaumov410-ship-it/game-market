<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube Premium</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* ЗАСТАВКА */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #121212 url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop') center center/cover no-repeat;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 80px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        .splash-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.3));
            z-index: 1;
        }
        .splash-content { position: relative; z-index: 2; text-align: center; }
        .splash-title {
            font-size: 2.5em; font-weight: bold; color: #fff;
            text-shadow: 0 4px 15px rgba(255,0,0,0.7); margin-bottom: 15px;
        }
        .splash-title span { color: #ff0000; }
        .loader-bar {
            width: 200px; height: 6px; background-color: rgba(255,255,255,0.2);
            border-radius: 3px; overflow: hidden; margin: 0 auto;
        }
        .loader-progress {
            width: 0%; height: 100%; background-color: #ff0000;
            box-shadow: 0 0 10px #ff0000; animation: loadProgress 1.2s linear forwards;
        }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        /* ШАПКА */
        header {
            background-color: #212121; padding: 12px 16px; display: flex;
            flex-direction: column; gap: 10px; position: sticky; top: 0;
            z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        @media(min-width: 600px) { header { flex-direction: row; justify-content: space-between; align-items: center; } }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-size: 1.4em; font-weight: bold; color: #ff0000; cursor: pointer; }
        .logo span { background-color: #ff0000; color: #fff; padding: 2px 6px; border-radius: 6px; margin-right: 4px; }
        
        .search-box { display: flex; width: 100%; max-width: 500px; }
        .search-box input {
            flex: 1; padding: 10px 14px; background-color: #121212;
            border: 1px solid #3c3c3c; color: white; border-radius: 20px 0 0 20px; outline: none;
        }
        .search-box button {
            background-color: #303030; border: 1px solid #3c3c3c; border-left: none;
            color: white; padding: 0 18px; border-radius: 0 20px 20px 0; cursor: pointer;
        }

        .header-controls { display: flex; align-items: center; gap: 10px; }
        .btn {
            background-color: #cc0000; color: white; border: none;
            padding: 9px 15px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9em;
        }
        .btn-upload { background-color: #3a3a3a; }
        .btn-logout { background-color: #555; display: none; }
        
        /* ЛЕНТА ВИДЕО */
        .container { padding: 16px; max-width: 1200px; margin: 0 auto; }
        h2 { font-size: 1.2em; margin: 0 0 20px 0; color: #aaa; font-weight: 500; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }
        .video-card { background-color: #161616; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail-box { position: relative; width: 100%; padding-top: 56.25%; background-size: cover; background-position: center; background-color: #222; }
        .video-info-block { padding: 12px; }
        .video-title { font-weight: 600; margin: 0 0 6px 0; font-size: 0.95em; line-height: 1.4; color: #f1f1f1; }
        .video-author { color: #ff4d4d; font-size: 0.85em; font-weight: bold; margin: 0 0 4px 0; }
        .video-author:hover { text-decoration: underline; }
        .video-stats { color: #aaa; font-size: 0.8em; margin: 0; }

        /* НАДЁЖНЫЙ ПЛЕЕР ДЛЯ IOS */
        .player-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center;
        }
        .player-container { width: 100%; max-width: 800px; position: relative; }
        .video-wrapper-responsive { position: relative; padding-bottom: 56.25%; height: 0; background-color: #000; }
        .video-wrapper-responsive video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block;
        }
        .player-back-btn {
            position: absolute; top: -45px; left: 10px; background: rgba(255,255,255,0.2);
            color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; z-index: 10;
        }
        .player-info-panel { padding: 16px; background-color: #121212; }
        .like-section { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .like-btn { background-color: #272727; border: none; color: white; padding: 8px 20px; border-radius: 18px; cursor: pointer; font-weight: bold; }
        .like-btn.liked { background-color: #cc0000; }

        /* МОДАЛКИ */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center;
            z-index: 1500; padding: 12px; box-sizing: border-box;
        }
        .modal-content { background-color: #212121; padding: 24px; border-radius: 16px; width: 100%; max-width: 450px; box-sizing: border-box; }
        .modal-content input {
            width: 100%; padding: 12px; margin-bottom: 14px; background-color: #121212;
            border: 1px solid #3c3c3c; color: white; border-radius: 8px; box-sizing: border-box;
        }
        .file-input-label {
            display: block; background-color: #303030; text-align: center;
            padding: 16px 12px; border-radius: 8px; border: 2px dashed #ff0000;
            cursor: pointer; margin-bottom: 14px; font-weight: bold; color: #ff4d4d;
        }
        .modal-close { background: none; border: none; color: #aaa; float: right; font-size: 1.6em; cursor: pointer; }
        .status-tag { font-size: 0.9em; color: #00ff66; font-weight: bold; }
        
        .channel-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .channel-avatar { width: 60px; height: 60px; border-radius: 50%; background-color: #ff0000; display: flex; align-items: center; justify-content: center; font-size: 1.8em; font-weight: bold; }
        .sub-btn { background-color: #ffffff; color: #000000; border: none; padding: 8px 16px; border-radius: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-overlay"></div>
        <div class="splash-content">
            <div class="splash-title">Запуск <span>My</span>Tube</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <header>
        <div class="header-top">
            <div class="logo" onclick="resetSearch()"><span>My</span>Tube</div>
            <div class="header-controls">
                <span id="userStatus" class="status-tag">Гость</span>
                <button class="btn btn-upload" onclick="openModal('uploadModal')">🎬 Выгрузить</button>
                <button class="btn" id="authBtn" onclick="openModal('authModal')">Войти</button>
                <button class="btn btn-logout" id="logoutBtn" onclick="handleLogout()">Выйти</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInp" placeholder="Поиск роликов...">
            <button onclick="runSearch()">🔍</button>
        </div>
    </header>

    <div class="container">
        <h2>Официальный канал Uh_Games (1.14 млн подписчиков)</h2>
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <div id="videoPlayerOverlay" class="player-overlay">
        <div class="player-container">
            <button class="player-back-btn" onclick="closePlayer()">← Назад</button>
            <div class="video-wrapper-responsive">
                <video id="mainVideoPlayer" controls playsinline></video>
            </div>
            <div class="player-info-panel">
                <h3 id="playingVideoTitle" style="margin: 0 0 6px 0;">Название</h3>
                <p id="playingVideoAuthor" style="margin: 0 0 12px 0; color: #ff4d4d; font-weight: bold; cursor: pointer; display: inline-block;"></p>
                <hr style="border: 0; border-top: 1px solid #333;">
                <div class="like-section">
                    <span id="playingVideoStats" style="color: #aaa; font-size: 0.9em;">👁 0 просмотров</span>
                    <button id="likeBtnSystem" class="like-btn" onclick="toggleLike()">👍 <span id="likeCountLabel">0</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="channelModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('channelModal')">×</button>
            <div class="channel-header">
                <div class="channel-avatar" id="chAvatar">U</div>
                <div>
                    <h3 id="chName" style="margin:0 0 4px 0;">Имя Канала</h3>
                    <p id="chSubs" style="margin:0; color:#aaa; font-size:0.9em;">0 подписчиков</p>
                </div>
            </div>
            <button id="subBtnSystem" class="sub-btn" style="width: 100%; padding: 12px;" onclick="toggleSubscribe()">Подписаться</button>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('authModal')">×</button>
            <h3>Создать аккаунт / Войти</h3>
            <input type="text" id="uName" placeholder="Придумайте никнейм">
            <input type="password" id="uPass" placeholder="Пароль">
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleAuth()">Войти</button>
        </div>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('uploadModal')">×</button>
            <h3>Выгрузить ролик</h3>
            <input type="text" id="vTitle" placeholder="Введите название ролика">
            
            <label class="file-input-label" for="galleryFile">📸 Медиатека, Камера или Файлы</label>
            <input type="file" id="galleryFile" accept="video/*" style="display: none;" onchange="fileSelected()">
            
            <p id="fileStatusLabel" style="color: #00ff66; font-size: 0.9em; text-align: center; margin-top: -5px; margin-bottom: 15px;"></p>
            
            <button class="btn" style="width: 100%; padding: 12px;" onclick="handleUpload()">Опубликовать на сайт</button>
        </div>
    </div>
